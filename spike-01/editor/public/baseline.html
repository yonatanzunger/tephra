<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseline — plain textarea</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23a8a29e'/%3E%3C/svg%3E">
<style>
  html, body { height: 100%; margin: 0; background: #faf9f8; }
  textarea {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0; outline: none; resize: none; padding: 3rem 20%;
    font: 18px/1.62 Georgia, serif; color: #292524; background: transparent;
  }
</style>
</head>
<body>
<textarea id="t" spellcheck="false"></textarea>
<script>
// The same instrumentation as the spike page, over the most primitive text
// surface the platform has. Whatever this measures is the floor: it is the
// browser's input-to-present pipeline and the display refresh, not an editor.
const metrics = { paint: [], paintLow: [], eventTiming: [], inputDelay: [], processing: [],
  inlineSamples: [], blockSamples: [], longTasks: 0, maxQueue: 0, initialBlockScan: 0 }
window.spikeMetrics = metrics
window.spikeOpts = {}
window.spikeRebuild = () => {}

let pending = [], scheduled = false
function schedule() {
  if (scheduled) return
  scheduled = true
  requestAnimationFrame(t1 => {
    const batch = pending; pending = []
    for (const t0 of batch) metrics.paintLow.push(t1 - t0)
    requestAnimationFrame(t2 => {
      scheduled = false
      for (const t0 of batch) metrics.paint.push(t2 - t0)
      if (pending.length) schedule()
    })
  })
}
const t = document.getElementById('t')
t.addEventListener('keydown', e => {
  if (e.isComposing) return
  pending.push(e.timeStamp)
  metrics.maxQueue = Math.max(metrics.maxQueue, pending.length)
  schedule()
}, true)
new PerformanceObserver(list => {
  for (const en of list.getEntries()) {
    if (en.name !== 'keydown') continue
    metrics.eventTiming.push(en.duration)
    metrics.inputDelay.push(en.processingStart - en.startTime)
    metrics.processing.push(en.processingEnd - en.processingStart)
  }
}).observe({ type: 'event', durationThreshold: 0, buffered: true })
try {
  new PerformanceObserver(l => { metrics.longTasks += l.getEntries().length })
    .observe({ type: 'longtask', buffered: true })
} catch (e) {}

// same document size, so the comparison is like for like
fetch('corpus.md').then(r => r.text()).then(txt => {
  t.value = txt
  window.view = {                      // just enough shape for the driver
    state: { doc: { length: txt.length, lines: txt.split('\n').length,
      lineAt: () => ({ from: 0 }), toString: () => txt } },
    scrollDOM: t,
    dispatch() {},
    posAtCoords: () => 0,
  }
  t.focus()
})
</script>
</body>
</html>
